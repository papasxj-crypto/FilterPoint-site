<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilterPoint App - Beta Tester Portal</title>
    <script async src="https://tally.so/widgets/embed.js"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --brand-blue: #1d4ed8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 16px;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 40px 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        .badge {
            display: inline-block;
            background: #dbeafe;
            color: var(--brand-blue);
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 15px;
        }

        .form-wrapper {
            margin-top: 16px;
            border-top: 1px solid var(--border);
            padding-top: 24px;
        }

        footer {
            text-align: center;
            margin-top: 32px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="badge">Confidential Beta Program</div>
        <h1>FilterPoint Software</h1>
        <p class="subtitle">Review and sign the agreement below to access the pre-release build.</p>
    </header>

    <div class="form-wrapper">
        <iframe 
            data-tally-src="https://tally.so/embed/VLOYeE?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1" 
            loading="lazy" 
            width="100%" 
            height="500" 
            frameborder="0" 
            marginheight="0" 
            marginwidth="0" 
            title="FilterPoint Beta Agreement">
        </iframe>
    </div>

    <footer>
        &copy; 2026 FilterPoint Software. All rights reserved.
    </footer>
</div>

</body>
</html>
